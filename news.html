<!DOCTYPE html> 
<html lang="en" data-theme="light">
<head> 
    <title>News - Troop 309</title> 
<!-- Head Loader -->
    <script src="scripts/loadComponents.js" defer></script>
<!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body   class="bg-slate-50 text-slate-900 bg-red-100">
    <div data-component="nav"></div>
<!-- SECTION  MAIN    -->
    <main class="max-w-4xl min-h-[55rem] mx-auto px-4  py-12"> 
        <h1 class="text-4xl font-bold mb-8 text-center">Troop Spotlight</h1> 
        <p class="text-center text-lg  -mt-3">Stay updated with the Scouts</h3>
        <hr class="mb-5">

        <div class="py-2 px-2 -space-x-1 ">
            <button class="filter-btn bg-gray-400/30 text-zinc font-normal px-3  shadow-lg hover:text-red-400 transition-colors duration-200 text-center"  onclick="filterByCategory('All')">All</button>
            <button class="filter-btn bg-gray-400/30 text-zinc font-normal px-3  shadow-lg hover:text-red-400 transition-colors duration-200 text-center"  onclick="filterByCategory('Recap')">Recap</button>
            <button class="filter-btn bg-gray-400/30 text-zinc font-normal px-3  shadow-lg hover:text-red-400 transition-colors duration-200 text-center"  onclick="filterByCategory('Anouncment')">Anouncment</button>
        </div>


<!-- Posts Container -->
        <div id="posts-container" class="space-y-8 "></div> 
            <!-- Posts will load here --> 
        <div class="text-center mt-6">
            <button id="load-more-btn" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400 transition">
                Load More
            </button>
        </div>


    <!-- Blog Modal -->
            <div id="blog-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 z-50">
                <div class="bg-white max-w-3xl w-full rounded shadow-lg overflow-y-auto max-h-[90vh] p-6 relative">
    
    <!-- Close button -->
                    <button id="close-modal" class="absolute top-3 right-3 text-gray-600 hover:text-black text-2xl"> &times; </button>

    <!-- Content loads here -->
                    <div id="modal-content"></div>

                </div>
            </div>
         
    </main>

<!-- SECTION FOOT -->
    <div data-component="footer"></div>

    <!-- Floating Action Buttons -->
    <div data-component="float" ></div>
    
<script src="scripts/blog.js"></script>
<script> // Initialize blog AFTER the page loads 
            initBlog(); </script>

</body>
</html>
