<!DOCTYPE html> 
<html lang="en" data-theme="light">
<head> 
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body   class="bg-slate-50 text-slate-900 bg-red-100">
<!-- SECTION  MAIN    -->
    <main class="max-w-4xl mx-auto px-4 py-12"> 
                <!-- Title --> 
                <h3 id="post-title" class="text-3xl font-bold mb-8 text-center"></h3>
        <div id="posts-container" class="space-y-8"> 
            <div>
                <!-- Hero Image -->
                <img id="post-hero" alt="hero image" class="bg-blue-100 w-full h-48 object-cover rounded-lg mb-6 hidden">
                
                <!-- Content --> 
                <article class="prose prose-lg max-w-none px-10"> 
                <!-- POST BODY -->
                    <div id="post-body" class="prose max-w-none"></div>
                    <!-- POST IMAGES -->
                    <div id="post-gallery" alt="post-image" class="grid grid-cols-2 gap-4 mb-6"></div>

                        <div class="inline-flex gap-1"> </div>
                    <!-- Add more content as needed --> 
                </article>
                <!-- Meta Info --> 
                <p id="post-meta" class="text-gray-500 mb-6 text-right"></p>
            </div>
        </div> 
    </main>

</body>
</html>
