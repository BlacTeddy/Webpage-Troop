<div id="floater" class="fixed bottom-20 right-4 flex flex-col space-y-4 z-10">

<!-- Button Modals -->
    <button data-modal-target="donate" class="bg-red-600 text-white px-4 py-2 rounded-full shadow-lg hover:bg-red-700 text-center">
            Donate
    </button>
    <button data-modal-target="join" class="bg-green-600 text-white px-4 py-2 rounded-full shadow-lg hover:bg-green-700 text-center">
        Join
    </button> 
    <button data-modal-target="contact" class="bg-blue-600 text-white px-4 py-2 rounded-full shadow-lg hover:bg-blue-700 text-center">
        Contat us
    </button>
</div>

<!-- Modal -->
<div id="donate" class="modal-overlay">
    <div class="modal-content">
        
        <h3>Donate</h3>      
    <!-- Content loads here -->
        <div id="modal-content">
            <p>Hello! I am the donate modal.</p>
        </div>
            <!-- Close button -->
            <button class="close-btn absolute top-3 right-3 text-gray-600 hover:text-black text-2xl">
                &times;</button>
    </div>
</div>

<div id="join" class="modal-overlay">
    <div class="modal-content">
        
        <h3>Join</h3>  
    <!-- Content loads here -->
        <div id="modal-content">
            <p>Hello! I am the join modal.</p>
        </div>
            <!-- Close button -->
            <button class="close-btn absolute top-3 right-3 text-gray-600 hover:text-black text-2xl">
                &times;</button>
    </div>
</div>

<div id="contact" class="modal-overlay">
    <div class="modal-content">

        <h3>Contat us</h3>

            <p>Hello! I am the contact modal.</p>

                &times;</button>

</div>
